# API gateway / load balancer.
#   /api/* and /socket.io/*  -> backend replicas (round robin; Docker DNS returns every replica of
#                               the "backend" service when Nginx starts)
#   /health                   -> gateway liveness
#   everything else           -> React frontend
# Socket.IO uses the WebSocket transport only, so no sticky sessions are needed.

upstream fraudshield_backend {
    server backend:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream fraudshield_frontend {
    server frontend:80;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location /api/ {
        proxy_pass http://fraudshield_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;       # the Test Runner endpoint can take a while
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location /socket.io/ {
        proxy_pass http://fraudshield_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://fraudshield_frontend;
        proxy_set_header Host $host;
    }
}
